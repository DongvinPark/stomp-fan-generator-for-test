plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'kr.co.alphacircle'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // STOMP 클라이언트 기능을 위해 필요
    implementation 'org.springframework:spring-messaging:6.1.5'
    implementation 'org.springframework:spring-websocket:6.1.5'

    // JSON 변환을 위해 필요 (Jackson)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // 실제 웹소켓 엔진 (Tyrus)dles:tyrus-standalone-client:1.19'
}

test {
    useJUnitPlatform()
}