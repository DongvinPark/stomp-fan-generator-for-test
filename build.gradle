plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'kr.co.alphacircle'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 인수를 받아서 실행하는 것을 허용하기 위함.
// 예를들면 ./gradlew bootRun --args="..." 이렇게.
bootRun {
    if (project.hasProperty('args')) {
        args project.args.split('\\s+')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // STOMP 클라이언트 기능을 위해 필요
    // 1. Spring Messaging & WebSocket (인터페이스 역할)
    implementation 'org.springframework:spring-messaging:6.1.5'

    // 2. Jakarta WebSocket API (인터페이스 정의)
    implementation 'jakarta.websocket:jakarta.websocket-api:2.1.1'

    // 3. Tomcat WebSocket (실제 구현체) - 클라이언트지만 엔진이 필요.
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.19'

    // 4. JSON 처리를 위한 Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // 로그 확인용
    implementation 'org.slf4j:slf4j-simple:2.0.12'
}

test {
    useJUnitPlatform()
}

// build.gradle 하단에 추가
tasks.named('bootJar') {
    archiveFileName = 'fan.jar' // 빌드 결과물 이름을 fan.jar로 고정
}